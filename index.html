<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maillots">
<meta name="theme-color" content="#0a0a0f">
<title>Maillots Stock</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --gold: #c9973a;
  --gold-dim: #8a6420;
  --green: #2ecc71;
  --red: #e74c3c;
  --blue: #7db8f7;
  --text: #f0ede8;
  --muted: #6b6880;
  --border: #2a2a38;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100dvh;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
  position: sticky; top: 0; z-index: 100;
}
.header-row { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-size: 22px; font-weight: 700; color: var(--gold); letter-spacing: -0.5px; }
.app-sub { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.header-btns { display: flex; gap: 8px; align-items: center; }
.btn-round {
  border: none; border-radius: 50%; width: 38px; height: 38px;
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: opacity .15s; flex-shrink: 0;
}
.btn-round:active { opacity: 0.6; }
.btn-gold { background: var(--gold); color: #000; font-size: 24px; font-weight: 300; }
.btn-dark { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

/* STATS */
.stats-bar { display: flex; gap: 10px; padding: 14px 20px; overflow-x: auto; scrollbar-width: none; }
.stats-bar::-webkit-scrollbar { display: none; }
.stat-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; flex-shrink: 0; text-align: center; min-width: 80px;
}
.stat-num { font-size: 20px; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-label { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.4px; }

/* SEARCH */
.search-wrap { padding: 0 20px 12px; }
.search-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px; padding: 10px 14px; outline: none;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--gold-dim); }

/* LIST */
.list { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }

/* CARD */
.maillot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.maillot-card.sold-out { opacity: 0.5; }
.card-top { display: flex; align-items: center; gap: 12px; }
.emoji-badge {
  font-size: 28px; width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface2); border-radius: 10px; border: 1px solid var(--border); flex-shrink: 0;
}
.info { flex: 1; min-width: 0; }
.club-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-row { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.tag-taille { background: #1e2a40; color: var(--blue); }
.tag-saison { background: #1e2d1e; color: var(--green); }
.tag-prix { background: #2d1e10; color: var(--gold); }
.notes-text { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* CARD ACTIONS ROW */
.card-actions-row {
  display: flex; gap: 8px; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid var(--border);
}
.action-block {
  flex: 1; background: var(--surface2); border-radius: 10px;
  padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 1px solid var(--border);
}
.action-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.action-value { font-size: 22px; font-weight: 700; line-height: 1; }
.action-value.stock-ok { color: var(--text); }
.action-value.stock-low { color: var(--red); }
.action-value.stock-zero { color: var(--muted); }
.action-value.vendu-val { color: var(--green); }
.qty-btns { display: flex; gap: 6px; }
.qty-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  font-size: 18px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: opacity .15s;
}
.qty-btn:active { opacity: 0.6; }
.btn-minus { background: #2a1515; color: var(--red); }
.btn-plus { background: #152a1e; color: var(--green); }

/* CARD BOTTOM BTNS */
.card-bottom { display: flex; gap: 8px; margin-top: 8px; }
.btn-edit, .btn-del {
  flex: 1; border: none; border-radius: 10px; padding: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 5px; transition: opacity .15s;
}
.btn-edit:active, .btn-del:active { opacity: 0.7; }
.btn-edit { background: #1a2e4a; color: var(--blue); }
.btn-del { background: #2a1515; color: var(--red); }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 56px; margin-bottom: 16px; }

/* MODAL */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 200; display: flex; align-items: flex-end;
  padding-bottom: env(safe-area-inset-bottom);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 24px 20px 28px; width: 100%;
  border-top: 1px solid var(--border);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  max-height: 90dvh; overflow-y: auto;
}
.overlay.open .modal { transform: translateY(0); }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: var(--gold); }
.field { margin-bottom: 13px; }
.field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
.field input, .field select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px; padding: 11px 14px;
  outline: none; font-family: inherit; -webkit-appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--gold-dim); }
.field select option { background: var(--surface2); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-cancel {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); border-radius: 12px; padding: 14px;
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-save {
  flex: 2; background: var(--gold); color: #000; border: none;
  border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.btn-cancel:active, .btn-save:active { opacity: 0.75; }

/* TOAST */
.toast {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%) translateY(30px);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 18px; font-size: 13px; color: var(--text);
  z-index: 300; opacity: 0; transition: opacity .2s, transform .2s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* INSTALL BANNER */
.install-banner {
  margin: 0 20px 10px; background: var(--surface2); border: 1px solid var(--gold-dim);
  border-radius: 12px; padding: 12px 16px; font-size: 13px; color: var(--text);
  line-height: 1.5; display: none;
}
.install-banner.visible { display: block; }
.install-banner strong { color: var(--gold); }
.install-close { float: right; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }


/* STOCK PAR TAILLE */
.size-stock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.size-stock-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; }
.size-stock-card.zero { opacity: .45; }
.size-name { font-size: 11px; color: var(--blue); font-weight: 700; margin-bottom: 4px; }
.size-count { font-size: 20px; font-weight: 800; }
.size-count.low { color: var(--red); }
.size-count.ok { color: var(--text); }
.size-count.zero { color: var(--muted); }
.size-controls { display: flex; gap: 5px; justify-content: center; margin-top: 7px; }
.size-controls .qty-btn { width: 26px; height: 26px; font-size: 16px; }
.sizes-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.size-input-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.size-input-box label { color: var(--blue); font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.size-input-box input { padding: 9px 8px; text-align: center; }
.size-summary { font-size: 12px; color: var(--muted); margin-top: 6px; }

</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="app-title">⚽ Maillots</div>
      <div class="app-sub">Gestion de stock</div>
    </div>
    <div class="header-btns">
      <button class="btn-round btn-dark" onclick="importJSON()" title="Importer">📥</button>
      <button class="btn-round btn-dark" onclick="exportJSON()" title="Exporter">📤</button>
      <button class="btn-round btn-gold" onclick="openModal()">+</button>
    </div>
  </div>
</header>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">

<div class="stats-bar" id="statsBar"></div>

<div class="search-wrap">
  <input class="search-input" type="search" placeholder="🔍  Rechercher..." id="searchInput" oninput="render()">
</div>

<div class="install-banner" id="installBanner">
  <button class="install-close" onclick="this.parentElement.style.display='none'">×</button>
  📲 <strong>Installer :</strong> Partager → <strong>Sur l'écran d'accueil</strong>
</div>

<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none">
  <div class="empty-icon">👕</div>
  <div style="color:var(--muted)">Aucun maillot</div>
</div>

<!-- MODAL AJOUT/EDIT -->
<div class="overlay" id="overlay" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Nouveau maillot</div>
    <div class="field">
      <label>Club / Équipe</label>
      <input id="fClub" type="text" placeholder="ex: AC Milan, PSG, OL…">
    </div>
    <div class="field">
      <label>Saison</label>
      <input id="fSaison" type="text" placeholder="2024/25">
    </div>

    <div class="field">
      <label>Stock par taille</label>
      <div class="sizes-form" id="sizesForm"></div>
      <div class="size-summary">Mets 0 si tu n'as pas cette taille. Exemple : M = 2, L = 1, XL = 3.</div>
    </div>

    <div class="field">
      <label>Déjà vendus total</label>
      <input id="fVendu" type="number" min="0" placeholder="0" value="0">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Prix vente (€)</label>
        <input id="fPrix" type="number" min="0" placeholder="0" step="0.5">
      </div>
      <div class="field">
        <label>Notes</label>
        <input id="fNotes" type="text" placeholder="domicile, third…">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveMaillot()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'maillots_stock_v3_tailles';
const OLD_STORAGE_KEY = 'maillots_stock_v2';
const TAILLES = ['XS','S','M','L','XL','XXL','Enf. S','Enf. M','Enf. L'];

let maillots = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
let editId = null;

if (!maillots) {
  const old = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY) || '[]');
  maillots = old.length ? migrateOldData(old) : [
    { id: Date.now(), club: 'AC Milan', saison: '2024/25', tailles: { M: 1, L: 2, XL: 1 }, vendu: 1, prix: 35, notes: 'Domicile' },
  ];
  save();
}

function migrateOldData(old) {
  const map = new Map();
  old.forEach(m => {
    const key = `${(m.club||'').trim().toLowerCase()}|${m.saison||''}|${m.prix||0}|${m.notes||''}`;
    if (!map.has(key)) map.set(key, { id: Date.now() + map.size, club: m.club, saison: m.saison||'', tailles: {}, vendu: 0, prix: m.prix||0, notes: m.notes||'' });
    const item = map.get(key);
    const taille = m.taille || 'L';
    item.tailles[taille] = (item.tailles[taille] || 0) + (parseInt(m.stock) || 0);
    item.vendu += parseInt(m.vendu) || 0;
  });
  return [...map.values()];
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(maillots)); }
function totalStock(m) { return Object.values(m.tailles || {}).reduce((a,v) => a + (parseInt(v)||0), 0); }

function getEmoji(club) {
  const c = club.toLowerCase();
  if (c.includes('psg') || c.includes('paris')) return '🔵🔴';
  if (c.includes('lyon') || c.includes('ol')) return '🔴🔵';
  if (c.includes('milan') || c.includes('ac milan')) return '🔴⚫';
  if (c.includes('inter')) return '⚫🔵';
  if (c.includes('barça') || c.includes('barcelona')) return '🔵🔴';
  if (c.includes('real') || c.includes('madrid')) return '⚪';
  if (c.includes('juve') || c.includes('juventus')) return '⚫⚪';
  if (c.includes('marseille') || c.includes('om')) return '🩵';
  if (c.includes('france') || c.includes('edf')) return '🇫🇷';
  if (c.includes('chelsea')) return '🔵';
  if (c.includes('arsenal')) return '🔴⚪';
  if (c.includes('liverpool')) return '🔴';
  if (c.includes('united') || c.includes('manu')) return '🔴';
  if (c.includes('city')) return '💙';
  if (c.includes('dortmund') || c.includes('bvb')) return '🟡⚫';
  if (c.includes('bayern')) return '🔴⚪';
  return '⚽';
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = maillots.filter(m =>
    m.club.toLowerCase().includes(q) ||
    TAILLES.some(t => t.toLowerCase().includes(q) && (m.tailles?.[t]||0) > 0) ||
    (m.notes||'').toLowerCase().includes(q)
  );

  const total = maillots.reduce((a,m) => a + totalStock(m), 0);
  const totalVendu = maillots.reduce((a,m) => a + (m.vendu||0), 0);
  const totalCA = maillots.reduce((a,m) => a + ((m.vendu||0)*(m.prix||0)), 0);
  const rupture = maillots.filter(m => totalStock(m)===0).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill"><div class="stat-num">${maillots.length}</div><div class="stat-label">Modèles</div></div>
    <div class="stat-pill"><div class="stat-num">${total}</div><div class="stat-label">En stock</div></div>
    <div class="stat-pill"><div class="stat-num">${totalVendu}</div><div class="stat-label">Vendus</div></div>
    <div class="stat-pill"><div class="stat-num">${totalCA.toFixed(0)}€</div><div class="stat-label">CA total</div></div>
    ${rupture ? `<div class="stat-pill"><div class="stat-num" style="color:var(--red)">${rupture}</div><div class="stat-label">Rupture</div></div>` : ''}
  `;

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (filtered.length === 0) { list.innerHTML=''; empty.style.display=''; return; }
  empty.style.display = 'none';

  list.innerHTML = filtered.map(m => {
    const stock = totalStock(m);
    const sc = stock === 0 ? 'stock-zero' : stock <= 2 ? 'stock-low' : 'stock-ok';
    const taillesHtml = TAILLES.map(t => {
      const n = parseInt(m.tailles?.[t]) || 0;
      const cls = n === 0 ? 'zero' : n === 1 ? 'low' : 'ok';
      return `<div class="size-stock-card ${n===0?'zero':''}">
        <div class="size-name">${t}</div>
        <div class="size-count ${cls}">${n}</div>
        <div class="size-controls">
          <button class="qty-btn btn-minus" onclick="changeSize('${m.id}','${t}',-1)">−</button>
          <button class="qty-btn btn-plus" onclick="changeSize('${m.id}','${t}',+1)">+</button>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="maillot-card ${stock===0?'sold-out':''}">
      <div class="card-top">
        <div class="emoji-badge">${getEmoji(m.club)}</div>
        <div class="info">
          <div class="club-name">${m.club}</div>
          <div class="meta-row">
            ${m.saison?`<span class="tag tag-saison">${m.saison}</span>`:''}
            ${m.prix?`<span class="tag tag-prix">${m.prix}€</span>`:''}
            <span class="tag tag-taille">${stock} en stock</span>
          </div>
          ${m.notes?`<div class="notes-text">${m.notes}</div>`:''}
        </div>
      </div>

      <div class="size-stock-grid">${taillesHtml}</div>

      <div class="card-actions-row">
        <div class="action-block">
          <div class="action-label">📦 Stock total</div>
          <div class="action-value ${sc}">${stock}</div>
        </div>
        <div class="action-block">
          <div class="action-label">✅ Vendus</div>
          <div class="action-value vendu-val">${m.vendu||0}</div>
          <div class="qty-btns">
            <button class="qty-btn btn-minus" onclick="changeVal('${m.id}','vendu',-1)">−</button>
            <button class="qty-btn btn-plus" onclick="changeVal('${m.id}','vendu',+1)">+</button>
          </div>
        </div>
      </div>

      <div class="card-bottom">
        <button class="btn-edit" onclick="openEdit('${m.id}')">✏️ Modifier</button>
        <button class="btn-del" onclick="deleteMaillot('${m.id}')">🗑️ Supprimer</button>
      </div>
    </div>`;
  }).join('');
}

function changeSize(id, taille, delta) {
  const m = maillots.find(x => x.id==id);
  if (!m) return;
  if (!m.tailles) m.tailles = {};
  const cur = parseInt(m.tailles[taille]) || 0;
  if (cur + delta < 0) return;
  m.tailles[taille] = cur + delta;
  save(); render(); showToast(`${taille} → ${m.tailles[taille]}`);
}

function changeVal(id, field, delta) {
  const m = maillots.find(x => x.id==id);
  if (!m) return;
  const cur = m[field] || 0;
  if (cur + delta < 0) return;
  m[field] = cur + delta;
  save(); render(); showToast(`✅ Vendus → ${m[field]}`);
}

function deleteMaillot(id) {
  if (!confirm('Supprimer ce modèle ?')) return;
  maillots = maillots.filter(x => x.id!=id);
  save(); render(); showToast('🗑️ Supprimé');
}

function buildSizeInputs(values = {}) {
  document.getElementById('sizesForm').innerHTML = TAILLES.map(t => `
    <div class="size-input-box">
      <label>${t}</label>
      <input class="size-field" data-size="${t}" type="number" min="0" value="${parseInt(values[t])||0}">
    </div>
  `).join('');
}

function readSizes() {
  const tailles = {};
  document.querySelectorAll('.size-field').forEach(input => {
    const n = parseInt(input.value) || 0;
    tailles[input.dataset.size] = n;
  });
  return tailles;
}

function openModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Nouveau maillot';
  document.getElementById('fClub').value = '';
  document.getElementById('fSaison').value = '';
  document.getElementById('fVendu').value = '0';
  document.getElementById('fPrix').value = '';
  document.getElementById('fNotes').value = '';
  buildSizeInputs({});
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('fClub').focus(), 350);
}

function openEdit(id) {
  const m = maillots.find(x => x.id==id);
  if (!m) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Modifier le modèle';
  document.getElementById('fClub').value = m.club;
  document.getElementById('fSaison').value = m.saison||'';
  document.getElementById('fVendu').value = m.vendu||0;
  document.getElementById('fPrix').value = m.prix||'';
  document.getElementById('fNotes').value = m.notes||'';
  buildSizeInputs(m.tailles || {});
  document.getElementById('overlay').classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function closeOnOverlay(e) { if (e.target===document.getElementById('overlay')) closeModal(); }

function saveMaillot() {
  const club = document.getElementById('fClub').value.trim();
  if (!club) { document.getElementById('fClub').focus(); return; }
  const data = {
    club,
    saison: document.getElementById('fSaison').value.trim(),
    tailles: readSizes(),
    vendu: parseInt(document.getElementById('fVendu').value)||0,
    prix: parseFloat(document.getElementById('fPrix').value)||0,
    notes: document.getElementById('fNotes').value.trim(),
  };
  if (editId) {
    const idx = maillots.findIndex(x => x.id==editId);
    maillots[idx] = { ...maillots[idx], ...data };
  } else {
    maillots.unshift({ id: Date.now(), ...data });
  }
  save(); closeModal(); render(); showToast(editId ? '✅ Modifié' : '✅ Ajouté');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function exportJSON() {
  const date = new Date().toISOString().slice(0,10);
  const blob = new Blob([JSON.stringify(maillots, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `maillots_${date}.json`; a.click();
  URL.revokeObjectURL(url); showToast('📤 Exporté');
}

function importJSON() { document.getElementById('importFile').value = ''; document.getElementById('importFile').click(); }

function normalizeImport(data) {
  return data.map(m => {
    if (m.tailles) return m;
    const tailles = {};
    tailles[m.taille || 'L'] = parseInt(m.stock) || 0;
    return { id: m.id || Date.now(), club: m.club || '', saison: m.saison || '', tailles, vendu: parseInt(m.vendu)||0, prix: parseFloat(m.prix)||0, notes: m.notes || '' };
  });
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error();
      if (!confirm(`Importer ${data.length} modèle(s) ? Les données actuelles seront remplacées.`)) return;
      maillots = normalizeImport(data); save(); render(); showToast(`✅ ${data.length} modèle(s) importé(s)`);
    } catch { alert('Fichier invalide.'); }
  };
  reader.readAsText(file);
}

if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.navigator.standalone) {
  document.getElementById('installBanner').classList.add('visible');
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && document.getElementById('overlay').classList.contains('open')) saveMaillot();
  if (e.key==='Escape') closeModal();
});

render();
</script>
</body>
